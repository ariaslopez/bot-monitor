<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Bot Monitor Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🤖</span>
                    <h1>Bot Monitor</h1>
                </div>
                <div class="header-stats">
                    <span class="stat" id="active-bots">
                        <span class="status-dot live"></span>
                        <span id="active-count">0</span> Active
                    </span>
                    <span class="stat">
                        🕒 <span id="current-time">--:--</span>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Summary Cards -->
            <div class="summary-section" id="summary">
                <div class="summary-card glass">
                    <div class="summary-icon">📊</div>
                    <div class="summary-data">
                        <div class="summary-value" id="total-tweets">0</div>
                        <div class="summary-label">Total Tweets</div>
                    </div>
                </div>
                
                <div class="summary-card glass">
                    <div class="summary-icon">👁️</div>
                    <div class="summary-data">
                        <div class="summary-value" id="total-impressions">0</div>
                        <div class="summary-label">Impresiones</div>
                    </div>
                </div>
                
                <div class="summary-card glass">
                    <div class="summary-icon">📈</div>
                    <div class="summary-data">
                        <div class="summary-value" id="uptime-percentage">0%</div>
                        <div class="summary-label">Uptime</div>
                    </div>
                </div>
            </div>

            <!-- Bots Grid -->
            <div class="bots-grid" id="bots-grid">
                <!-- Bot cards se cargan dinámicamente -->
                <div class="loading-state glass">
                    <div class="spinner"></div>
                    <p>Cargando bots...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>💫 Auto-refresh cada 30s • Hecho con ❤️ por <a href="https://github.com/ariaslopez" target="_blank">@ariaslopez</a></p>
        </div>
    </footer>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
